name: Fetch hot stocks data and render HTML

on:
  schedule:
    - cron: '30 09 * * 1-5'  # 工作日 09:30 UTC+8 = 01:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data and render
        env:
          NEODATA_TEMP_TOKEN: ${{ secrets.NEODATA_TEMP_TOKEN }}
        run: |
          set -x
          python fetch_and_render_v4.py
          ls -la index.html

      - name: Commit and push
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html cache/
          git diff --cached --quiet || (git commit -m "Update hot stocks $(date +%Y-%m-%d)" && git push)
